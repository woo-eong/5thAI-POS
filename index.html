<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market POS - 5학년 영어 시장놀이</title>
    
    <!-- 티처블머신 공식 TensorFlow.js 및 Teachable Machine Image 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #2c3e50; }
        .box {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #webcam-container {
            width: 280px;
            height: 280px;
            margin: 15px auto;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
        }
        #webcam-container canvas {
            transform: scaleX(-1); /* 거울모드 좌우반전 */
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #2563eb; }
        .result-box {
            margin-top: 20px;
            background: #1e293b;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }
        .price-en {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>🛒 AI Market POS</h1>
    <p>5학년 영어 9단원: They Are Twenty Thousand Won</p>

    <div class="box">
        <div id="webcam-container">카메라가 꺼져 있습니다</div>
        <button type="button" onclick="init()">🎥 카메라 켜기 / 다시 인식하기</button>

        <div class="result-box">
            <div id="label-name" style="font-size: 1.1rem; color: #94a3b8;">가격표를 비춰주세요</div>
            <div id="price-en" class="price-en">Show me the price tag!</div>
        </div>

        <div id="label-container" style="margin-top: 15px; text-align: left; font-size: 0.9rem;"></div>
    </div>

    <script type="text/javascript">
        // 모델이 있는 폴더 경로 (index.html과 같은 위치)
        const URL_PATH = "./";

        let model, webcam, labelContainer, maxPredictions;
        let isRunning = false;

        // 가격 매핑 (10,000 won 형식)
        const priceMap = {
            "class_10000": "They are 10,000 won.",
            "class_20000": "They are 20,000 won.",
            "class_30000": "They are 30,000 won.",
            "class_40000": "They are 40,000 won.",
            "class_50000": "They are 50,000 won."
        };

        // 페이지 로드 시 모델 불러오기
        async function loadModel() {
            try {
                const modelURL = URL_PATH + "model.json";
                const metadataURL = URL_PATH + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            } catch (e) {
                console.error(e);
                document.getElementById("label-name").innerText = "모델 파일을 읽지 못했습니다.";
            }
        }

        // 카메라 시작 및 재시작 함수
        async function init() {
            if (!model) {
                await loadModel();
                if (!model) return;
            }

            // 이미 실행 중이면 멈춤
            if (isRunning) {
                try {
                    await webcam.stop();
                } catch(e) {}
                isRunning = false;
            }

            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.innerHTML = "";

            try {
                // 웹캠 설정 (가로세로 280px, 거울모드 true)
                const flip = true;
                webcam = new tmImage.Webcam(280, 280, flip);
                await webcam.setup(); // 카메라 권한 요청
                await webcam.play();
                
                webcamContainer.appendChild(webcam.canvas);
                
                const videoEl = webcam.canvas;
                if(videoEl) videoEl.setAttribute("playsinline", true);

                isRunning = true;
                window.requestAnimationFrame(loop);

            } catch (err) {
                alert("카메라를 켤 수 없습니다. 브라우저 권한을 확인해주세요.");
                console.error(err);
                isRunning = false;
            }
        }

        async function loop() {
            if (!isRunning) return;
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model || !webcam) return;

            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                
                // 확률 바텍스트 표시
                const classPrediction = `${className}: ${(probability * 100).toFixed(0)}%`;
                if (labelContainer.childNodes[i]) {
                    labelContainer.childNodes[i].innerHTML = classPrediction;
                }

                if (probability > highestProb) {
                    highestProb = probability;
                    bestClass = className;
                }
            }

            // 70폭 이상이고 background가 아닐 때 결과 출력 및 TTS
            if (highestProb >= 0.70 && bestClass !== "background") {
                const englishText = priceMap[bestClass] || bestClass;
                document.getElementById("label-name").innerText = bestClass;
                document.getElementById("price-en").innerText = englishText;
            } else {
                document.getElementById("label-name").innerText = "인식 중...";
                document.getElementById("price-en").innerText = "Show me the price tag!";
            }
        }
    </script>
</body>
</html>
